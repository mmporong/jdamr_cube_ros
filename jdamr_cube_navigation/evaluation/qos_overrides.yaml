# 기록·재생 QoS 정본. jdamr_cube_navigation.onboard_recording 에서 생성한다.
#
# 2026-09-04: 고주기 토픽을 best_effort 로 내렸다. 기록기가 reliable 로 받으면
# 밀릴 때 발행자의 write 가 막히고, 그러면 로깅이 제어 루프를 세운다. 실주행
# 에서 CPU 61~146%(400% 중)로 자원이 남는데 컨트롤 루프가 10Hz -> 1.7Hz 로
# 떨어지고 lifecycle heartbeat 가 끊겨 노드 9개가 한꺼번에 사라졌다.
# 부하가 걸리면 기록기가 몇 건을 잃되 로봇은 계속 달리는 쪽을 택한다.
#
# /tf_static 은 한 번만 오는 latched 라 reliable 을 유지한다. 저주기 토픽도
# 역압 위험이 없어 reliable 이다.

/scan:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10

/odom:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 25

/tf:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 50

/tf_static:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 1

/imu/data_raw:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 25

/cmd_vel:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 40

/cmd_vel_nav:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 40

/amcl_pose:
  reliability: reliable
  durability: transient_local
  history: keep_last
  depth: 10

/battery_state:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 10

/plan:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 10

/collision_monitor_state:
  reliability: reliable
  durability: volatile
  history: keep_last
  depth: 20

/joint_states:
  reliability: best_effort
  durability: volatile
  history: keep_last
  depth: 10
