schema_version: 1
as_of: '2026-09-01'

policy:
  checksum_algorithm: sha256
  checksum_input: '<parent>-><child>|xyz=<x>,<y>,<z>|rpy=<roll>,<pitch>,<yaw>'
  fusion_allowed_statuses:
    - VERIFIED
  blocked_statuses:
    - UNVERIFIED
    - UNOBSERVABLE
  notes:
    - 센서 외부 파라미터와 시간 기준을 검증하지 않은 상태에서는 다중 센서 융합 성능을 주장하지 않는다.
    - 동일 프레임으로 발행되는 센서도 실제 장착 위치와 시간 지연을 별도로 검증한다.

calibrations:
  - calibration_id: g4_lidar_base_link_to_laser_link_v1
    sensor: lidar
    source: jdamr_cube_description/urdf/jdamr_cube.urdf
    transform_kind: static_tf
    parent_frame: base_link
    child_frame: laser_link
    translation_m: [0.0, 0.0, 0.1]
    rotation_rpy_rad: [0.0, 0.0, 3.141592653589793]
    canonical_transform: base_link->laser_link|xyz=0,0,0.1|rpy=0,0,3.141592653589793
    canonical_sha256: 2ece7c2666b61ee2396e8fbbc65c5a3c26aa0a665ea74e17f2e5e73e17141d7a
    timestamp_source: driver_estimated
    status: UNVERIFIED
    verified_at: null
    translation_uncertainty_m: null
    rotation_uncertainty_rad: null
    time_offset_uncertainty_ms: null
    fusion_allowed: false
    verification_needed:
      - 평면 벽 왕복 주행으로 yaw 부호와 전방 축을 확인한다.
      - 정지 구간과 회전 구간에서 scan-to-odom 시간 오프셋을 추정한다.

  - calibration_id: esp32_imu_base_link_to_imu_link_v2
    sensor: imu
    source: jdamr_cube_description/urdf/new_base_real.urdf
    timestamp_evidence: jdamr_base_driver/src/base_driver_node.cpp
    transform_kind: static_urdf_joint
    parent_frame: base_link
    child_frame: imu_link
    translation_m: [0.0, 0.0, 0.0]
    rotation_rpy_rad: [3.141592653589793, 0.0, 1.5707963267948966]
    canonical_transform: base_link->imu_link|xyz=0,0,0|rpy=3.141592653589793,0,1.5707963267948966
    canonical_sha256: 1b6da1675525fbef1b7908f28646d5ca00f4f23de190d8be112fa95d1e49ad72
    timestamp_source: ros_receipt
    status: UNVERIFIED
    verified_at: null
    translation_uncertainty_m: null
    rotation_uncertainty_rad: null
    time_offset_uncertainty_ms: null
    fusion_allowed: false
    warnings:
      - 활성 C++ 드라이버는 펌웨어 상태 수신 시각의 ROS now()를 사용한다.
      - 회전은 2026-10-01 주행 bag으로 정했다(new_base_geometry.yaml imu_rotation_rpy). 위치는 재지 않아 0으로 둔다.
      - 2026-10-01 이전 bag의 /imu/data_raw는 frame_id base_link로 기록됐지만 축은 이 회전을 따른다.
    verification_needed:
      - 정지 상태 바이어스와 Allan deviation을 측정한다.
      - 급정지·회전 데이터로 수신 지연과 드롭을 확인한다.
      - 보드 위치(가속도 융합 시 필요)를 잰다.
