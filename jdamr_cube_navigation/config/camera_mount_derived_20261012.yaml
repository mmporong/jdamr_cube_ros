    plane_rms_m_max: 0.007378300169265092
    physical_parking_accuracy: NOT_INDEPENDENTLY_VALIDATED_AFTER_YAW_FIT
    invalidate_when: 카메라·상판 위치 또는 방향 변경
    height_prior: 사용자 약 1 m는 바닥 후보 선택의 선행 추정치. z 값은 관측 평면 거리 평균에서 산출
    unobserved_axes: y=0 중앙 설치는 가정. yaw는 근거리 두 자세의 실측으로 추정했으며 다른 거리·자세에서 재확인해야 함
