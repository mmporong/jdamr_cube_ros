      reference_width_m: 0.450
      measured_heading_error_rad: 0.04001067435398891
      depth_heading_error_rad: 0.023494093035457096
      calculation: asin((right_gap-left_gap)/frame_width)에서 깊이 관측의 방향 오차를 뺀 값
      evidence: $HOME/jdamr_data/map_20260930_manual/aligned/runs/table_parking_20261013_110352/parking_20261013_123410/operator_arrival_measurement.json
      scope: 한 정지 위치의 좌우 간격과 깊이 추정 차이. 카메라 yaw 외에 모서리 검출과 측정 오차가 섞일 수 있어 보정값으로 미적용
    evidence: $HOME/jdamr_data/predeparture_20261012_141234/camera_floor_samples.npz;
