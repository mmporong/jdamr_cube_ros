        scope: 동일 정지 위치의 간격 대조이며 각도 실측이나 다른 거리의 정확도 검증이 아님
    yaw_candidate:
      value: 0.016516581318531814
      unit: rad
      estimated_at: '2026-10-13'
      valid_for: 현재 카메라와 차체 장착 상태
      source: user_front_corner_gaps_compared_with_stationary_depth
