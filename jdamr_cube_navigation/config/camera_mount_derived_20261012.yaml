        right_gap_m: 0.065
        measured_heading_error_rad: 0.03333950926130209
        raw_depth_heading_rad: 0.00612917750017683
      calculation: 각 실측의 asin((right_gap-left_gap)/frame_width)에서 원본 모서리를 차체 좌표로 변환한 각도를 뺀 뒤 두 차이의 평균을 구함
      in_sample_max_angle_residual_deg: 0.30918828725603764
      leave_one_out_max_angle_residual_deg: 0.6183765745120499
      evidence: $HOME/jdamr_data/map_20260930_manual/aligned/runs/table_parking_20261013_110352/parking_20261013_134752/yaw_bias_offline_comparison.json
