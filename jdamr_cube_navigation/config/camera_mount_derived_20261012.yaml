    orientation_height_basis: 높이와 roll은 기존 정지 깊이 영상 바닥 후보 평면 3개 프레임의
      SVD 법선/거리에서 산출. pitch는 아래 임시 추정값을 사용함
    pitch_estimate:
      value: 15.0
      unit: deg
