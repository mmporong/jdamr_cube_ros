    - 0.8222579903426075
    - 0.8258317929759704
    plane_rms_m_max: 0.007378300169265092
    physical_parking_accuracy: NOT_MEASURED
    invalidate_when: 카메라·상판 위치 또는 방향 변경
    height_prior: 사용자 약 1 m는 바닥 후보 선택의 선행 추정치. z 값은 관측 평면 거리 평균에서 산출
    unobserved_axes: y=0 중앙 설치와 yaw=0 전방 정렬은 설치 가정. 좌우 간격 대조의 yaw 후보는 다른 자세에서 부호와 크기를 재확인해야 함
