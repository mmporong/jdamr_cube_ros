schema_version: 1
# Candidate localization confidence limits, not a measured accuracy guarantee.
# Standard deviation limits: 0.10 m on each map axis and 10 degrees in yaw.
# AMCL covariance gates disabled by the operator (2026-09-30 15:40, "공분산이나 한도 쓰지 말라");
# finite/non-negative sanity checks remain in code. Previous: strict 0.01 m2 / (10 deg)^2,
# intermediate 0.04 m2 / (15 deg)^2 (intermediate_bound_provenance below).
max_x_covariance_m2: 1.0e+6
max_y_covariance_m2: 1.0e+6
max_yaw_covariance_rad2: 1.0e+6
# Intermediate legs (route to the observation waypoint, box observation and
# face alignment, precision home staging plan and drive) stop only when
# localization is lost; final approach, stop confirmations, box escape, docking
# and activation keep the limits above. Basis: intermediate_bound_provenance.
intermediate_max_x_covariance_m2: 1.0e+6
intermediate_max_y_covariance_m2: 1.0e+6
intermediate_max_yaw_covariance_rad2: 1.0e+6
physical_validation: NOT_PHYSICALLY_VALIDATED
