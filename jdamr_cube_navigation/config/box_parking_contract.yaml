schema_version: 1
reference_frame: map
robot_base_frame: base_link
# Candidate control tolerances; not measured physical accuracy.
xy_tolerance_m: 0.01
# 3 deg (contract maximum): the 1 deg box tolerance rejected a 0.65 cm / 1.83 deg
# water-station stop (2026-09-30); AMCL yaw noise is 4-5 deg (1 sigma).
yaw_tolerance_deg: 3.0
stopped_linear_mps: 0.01
stopped_angular_radps: 0.02
hold_s: 1.0
observation_timeout_s: 5.0
sample_max_age_s: 0.5
# 0.08 m/s (contract maximum, as the dock contract): at 0.04 m/s with slowdown from
# 0.6 m the whole 0.44 m approach crawled at 0.02-0.03 m/s (2026-10-01).
desired_linear_mps: 0.08
# 0.02 m/s (contract maximum) keeps the slowest final-approach command at twice
# the 0.05 m / 10 s progress requirement; 0.01 stalled 8 cm short (2026-09-30).
min_approach_linear_mps: 0.02
rotate_angular_radps: 0.2
# Front gap of the final box approach (operator, 2026-10-06: 1-2 cm, "relax the
# safety distance"; 5 cm until then). The LiDAR cannot see within 0.205 m of the
# front, so no Collision Monitor zone sees the face in the last part; the gap rests on
# the face observed before the approach and odom. Operator tape at the water station
# centre: 2.0 cm at a 1.5 cm target (estimate 1.85 cm), 1.5 cm at a 1.0 cm target
# (estimate 1.33 cm). 2 cm for a protruding front part, then 1 cm (operator, 16:31).
# 1 cm is the loader's lower bound: the +-1 cm judgement then keeps the nearest
# corner above the face.
target_front_gap_m: 0.01
target_basis: USER_ACCEPTED_TARGET
physical_validation: NOT_PHYSICALLY_VALIDATED
