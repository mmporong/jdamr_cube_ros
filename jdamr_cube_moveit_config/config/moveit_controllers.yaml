moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

# 이름/조인트는 jdamr_cube_description/config/so101_controllers.yaml의 ros2_control
# 컨트롤러(gz_ros2_control)와 동일해야 move_group이 실제 시뮬레이션 로봇을 움직일 수 있다.
moveit_simple_controller_manager:
  controller_names:
    - arm_controller
    - gripper_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true
    joints:
      - arm_shoulder_pan
      - arm_shoulder_lift
      - arm_elbow_flex
      - arm_wrist_flex
      - arm_wrist_roll

  gripper_controller:
    type: GripperCommand
    action_ns: gripper_cmd
    default: true
    joints:
      - arm_gripper
