camera_mount:
  status: measured
  parent_frame: base_link
  child_frame: camera_link
  transform:
    x_m: 0.065
    y_m: 0.000
    z_m: 0.215
    roll_rad: 0.000
    pitch_rad: 0.000
    yaw_rad: 0.000
  provenance:
    measured_at: 2026-09-17
    valid_for: "Current temporary Astra S mounting pose"
    method: >-
      Camera lens plane aligned with the measured chassis front plane
      (65 mm ahead of the wheel axis), centered laterally, lens center
      measured 215 mm above the floor, and front-facing mount confirmed
      by the user. Zero roll and pitch are nominal bracket alignment values.
    orientation_status: "Nominal level alignment; not inclinometer-calibrated"
    invalidate_when: "Camera bracket position or orientation changes"

usage_gate:
  camera_only_rgbd_slam: allowed
  wheel_odom_fusion: allowed
  lidar_rgbd_fusion: blocked_until_cross_sensor_validation
